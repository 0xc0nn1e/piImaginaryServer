[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-processing-server"
version = "0.1.0"
description = "Durable server-side audio ingestion, transcription, diarization, and analysis backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ai = [
  "faster-whisper==1.2.1",
  "pyannote.audio==4.0.7",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
audio-server = "audio_server.main:run"
audio-worker = "audio_server.jobs.worker:main"
audio-web-reset-password = "audio_server.web_auth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL, ffmpeg, downloaded models, or external runtime services",
  "ai: requires locally cached AI models and optional model credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["audio_server"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "pyannote.*", "torch.*"]
ignore_missing_imports = true
